# Eclipse OS: when the kernel's deferred framebuffer console takeover happens (first output on a VT, often
# while autologin opens tty1), udev restarts this unit (90-vconsole.rules) and loadkeys/setfont can hit EIO
# for a moment. Try again instead of leaving a failed unit behind.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=8

[Service]
Restart=on-failure
RestartSec=1
