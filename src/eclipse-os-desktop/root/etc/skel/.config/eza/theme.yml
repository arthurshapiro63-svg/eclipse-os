# Generated by theme-apply from tokens/eclipse.json via templates/eza-theme.tmpl. Edit the template, not this file.
# Eclipse eza theme -- tokens from ~/.config/theme/tokens/eclipse.json
# Directories carry the accent; everything else sits in the grey-blue ramp, with
# semantic colours only where they mean something (exec, write bit, git state, root).
colourful: true

filekinds:
  normal:       { foreground: "#9A958E", is_bold: false }
  directory:    { foreground: "#D08A4E", is_bold: true }
  symlink:      { foreground: "#FFE6B8", is_bold: false }
  pipe:         { foreground: "#E0B040", is_bold: false }
  block_device: { foreground: "#E0B040", is_bold: true }
  char_device:  { foreground: "#E0B040", is_bold: false }
  socket:       { foreground: "#C98FA6", is_bold: false }
  special:      { foreground: "#C98FA6", is_bold: false }
  executable:   { foreground: "#3FD69A", is_bold: true }
  mount_point:  { foreground: "#EDB98A", is_bold: true, is_underline: true }

perms:
  user_read:          { foreground: "#9A958E", is_bold: false }
  user_write:         { foreground: "#E0B040", is_bold: false }
  user_execute_file:  { foreground: "#3FD69A", is_bold: true, is_underline: false }
  user_execute_other: { foreground: "#3FD69A", is_bold: false }
  group_read:         { foreground: "#6A665F", is_bold: false }
  group_write:        { foreground: "#6A665F", is_bold: false }
  group_execute:      { foreground: "#6A665F", is_bold: false }
  other_read:         { foreground: "#6A665F", is_bold: false }
  other_write:        { foreground: "#D42B2B", is_bold: false }
  other_execute:      { foreground: "#6A665F", is_bold: false }
  special_user_file:  { foreground: "#C98FA6", is_bold: false }
  special_other:      { foreground: "#C98FA6", is_bold: false }
  attribute:          { foreground: "#6A665F", is_bold: false }

size:
  major:       { foreground: "#6A665F", is_bold: false }
  minor:       { foreground: "#6A665F", is_bold: false }
  number_byte: { foreground: "#6A665F", is_bold: false }
  number_kilo: { foreground: "#9A958E", is_bold: false }
  number_mega: { foreground: "#FFE6B8", is_bold: false }
  number_giga: { foreground: "#EDB98A", is_bold: false }
  number_huge: { foreground: "#E0B040", is_bold: false }
  unit_byte:   { foreground: "#6A665F", is_bold: false }
  unit_kilo:   { foreground: "#6A665F", is_bold: false }
  unit_mega:   { foreground: "#6A665F", is_bold: false }
  unit_giga:   { foreground: "#6A665F", is_bold: false }
  unit_huge:   { foreground: "#6A665F", is_bold: false }

users:
  user_you:    { foreground: "#9A958E", is_bold: false }
  user_root:   { foreground: "#D42B2B", is_bold: false }
  user_other:  { foreground: "#E0B040", is_bold: false }
  group_yours: { foreground: "#6A665F", is_bold: false }
  group_other: { foreground: "#6A665F", is_bold: false }
  group_root:  { foreground: "#D42B2B", is_bold: false }

links:
  normal:          { foreground: "#FFE6B8", is_bold: false }
  multi_link_file: { foreground: "#E0B040", is_bold: false }

git:
  new:        { foreground: "#3FD69A", is_bold: false }
  modified:   { foreground: "#E0B040", is_bold: false }
  deleted:    { foreground: "#D42B2B", is_bold: false }
  renamed:    { foreground: "#FFE6B8", is_bold: false }
  ignored:    { foreground: "#4A4A50", is_bold: false }
  conflicted: { foreground: "#D42B2B", is_bold: true }

git_repo:
  branch_main:  { foreground: "#9A958E", is_bold: false }
  branch_other: { foreground: "#E0B040", is_bold: false }
  git_clean:    { foreground: "#3FD69A", is_bold: false }
  git_dirty:    { foreground: "#E0B040", is_bold: false }

file_type:
  image:      { foreground: "#C98FA6", is_bold: false }
  video:      { foreground: "#E3B6C7", is_bold: false }
  music:      { foreground: "#FFE6B8", is_bold: false }
  crypto:     { foreground: "#3FD69A", is_bold: false }
  document:   { foreground: "#ECEAE6", is_bold: false }
  compressed: { foreground: "#EA5A5A", is_bold: false }
  temp:       { foreground: "#6A665F", is_bold: false }
  compiled:   { foreground: "#6A665F", is_bold: false }
  build:      { foreground: "#E0B040", is_underline: true }
  source:     { foreground: "#FFF6E4", is_bold: false }

punctuation:         { foreground: "#4A4A50", is_bold: false }
date:                { foreground: "#6A665F", is_bold: false }
inode:               { foreground: "#6A665F", is_bold: false }
blocks:              { foreground: "#6A665F", is_bold: false }
header:              { foreground: "#ECEAE6", is_underline: true }
octal:               { foreground: "#6A665F", is_bold: false }
flags:               { foreground: "#6A665F", is_bold: false }
control_char:        { foreground: "#D42B2B", is_bold: false }
broken_symlink:      { foreground: "#D42B2B", is_bold: false }
broken_path_overlay: { is_underline: true }
