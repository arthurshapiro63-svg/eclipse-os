# Settings for ~/.local/bin/wallpaper-theme (sourced as bash).
# HUE_CLAMP=1 keeps the accent inside the blue band [HUE_MIN, HUE_MAX] (HSL degrees)
# by rotating matugen's source colour. Set HUE_CLAMP=0 to accept whatever the
# wallpaper produces. One-off override: WALLPAPER_HUE_CLAMP=0 wallpaper next
HUE_CLAMP=1
HUE_MIN=200
HUE_MAX=230
SCHEME=scheme-tonal-spot
DMS_FOLLOW=0   # 1 = point DMS at the generated theme (see note in wallpaper-theme)
GHOSTTY_FOLLOW=1
