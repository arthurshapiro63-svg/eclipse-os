# Generated by theme-apply from tokens/eclipse.json via templates/hyprlock.tmpl. Edit the template, not this file.
# Eclipse — hyprlock, glass treatment (same language as the DMS bar):
# blurred current wallpaper, a glass password pill (surface @ 0.62 over the blur, 1px light
# hairline on its top edge, accent ring), Inter ExtraLight clock, date, user row, status row.
# Fail / caps-lock recolour the ring (error / warning). All text carries a soft shadow.
# Tokens: ~/.config/theme/tokens/eclipse.json -- hyprlock cannot read JSON, so theme-apply
# writes the values below. Launched directly by hypridle (not via loginctl); nothing here
# changes how it is started.
$mono = JetBrainsMono Nerd Font
$ui   = Inter

$text_primary   = rgb(ECEAE6)
$text_secondary = rgb(9A958E)
$text_muted     = rgb(6A665F)
$bg_base        = rgb(0B0B0D)
$surface_glass  = rgba(17181b9e)          # surface @ 0.62: the bar's glass fill
$hairline       = rgba(eceae638)     # text-primary @ 0.22: lit top edge
# accent ring = the same 3-stop 45deg gradient as the Hyprland active window border
$accent_ring    = rgba(fff6e4ff) rgba(ffc94aee) rgba(e89b2aaa) rgba(6e4f3688) 45deg
$check_ring     = rgba(ffe6b8ff)    # checking
$error_ring     = rgba(d42b2bff)            # wrong password
$warning_ring   = rgba(e0b040ff)          # caps lock on
$shadow         = rgba(000000cc)           # shadow @ 0.80

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2500
}

# Motion (Eclipse): the lock fades up slowly like dusk falling and leaves quickly; the ring eases between
# gold / checking / wrong / caps lock instead of snapping; dots and width glide. Speeds are tenths of a
# second on the real clock (hyprlock uses the same animation engine as Hyprland).
animations {
    enabled = true
    bezier = glass, 0.22, 1, 0.36, 1
    bezier = sink, 0.45, 0, 0.78, 0.4
    animation = fadeIn, 1, 7, glass
    animation = fadeOut, 1, 3, sink
    animation = inputFieldColors, 1, 4, glass
    animation = inputFieldFade, 1, 4, glass
    animation = inputFieldWidth, 1, 3, glass
    animation = inputFieldDots, 1, 2, glass
}

# ── Background: the current wallpaper (symlink kept by ~/.local/bin/wallpaper), blurred
# like the glass it sits behind. Not `path = screenshot`: that leaks whatever was on screen.
background {
    monitor =
    path = ~/.cache/current-wallpaper-lock
    color = $bg_base
    blur_passes = 3
    blur_size = 6
    noise = 0.012
    contrast = 1.0
    brightness = 0.82
    vibrancy = 0.24
    vibrancy_darkness = 0.0
}

# ── Clock — Inter ExtraLight (font.clock-weight 200), text-primary
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_primary
    font_size = 132
    font_family = $ui ExtraLight
    shadow_passes = 2
    shadow_size = 8
    shadow_color = $shadow
    position = 0, 170
    halign = center
    valign = center
}

# ── Date — text-secondary
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $text_secondary
    font_size = 17
    font_family = $ui
    shadow_passes = 2
    shadow_size = 5
    shadow_color = $shadow
    position = 0, 58
    halign = center
    valign = center
}

# ── A thin corona line between the date and the field (sun colour, fading at both ends)
shape {
    monitor =
    size = 180, 1
    color = rgba(ffc94aaa)
    rounding = 0
    border_size = 0
    position = 0, 30
    halign = center
    valign = center
}

# ── Glass password pill: surface @ 0.62, pill radius, 2px accent ring.
# hyprlock has no focus/unfocus state (the field is always the focus target), so the
# accent ring is permanent; check / fail / caps lock swap it for accent-bright / error / warning.
input-field {
    monitor =
    size = 380, 56
    outline_thickness = 2
    rounding = -1
    inner_color = $surface_glass
    outer_color = $accent_ring
    check_color = $check_ring
    fail_color = $error_ring
    capslock_color = $warning_ring
    font_color = $text_primary
    font_family = $mono
    dots_size = 0.2
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##9A958E" font_family="Inter">Password</span>
    check_text = <span foreground="##9A958E" font_family="Inter">Checking…</span>
    fail_text = <span foreground="##D42B2B" font_family="Inter">Wrong password. Try again.</span>
    shadow_passes = 2
    shadow_size = 10
    shadow_color = $shadow
    position = 0, -60
    halign = center
    valign = center
    zindex = 0
}

# ── 1px light hairline along the pill's top edge, just inside the ring (the glass "lit edge").
# Pill: 56 px tall centred at y -60, so its top edge is y -32 and the ring fills -32..-34.
shape {
    monitor =
    size = 300, 1
    color = $hairline
    rounding = 0
    border_size = 0
    position = 0, -35
    halign = center
    valign = center
    zindex = 1
}

# ── User row — text-secondary (text-muted is under 4.5:1 on the dark lock), Arch glyph in the sun colour
label {
    monitor =
    text = <span foreground="##FFC94A"></span>  $USER
    color = $text_secondary
    font_size = 14
    font_family = $ui
    shadow_passes = 1
    shadow_size = 4
    shadow_color = $shadow
    position = 0, -122
    halign = center
    valign = center
}

# ── Status row (battery if present, network) — text-secondary, bottom
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-status.sh
    color = $text_secondary
    font_size = 12
    font_family = $ui
    shadow_passes = 1
    shadow_size = 4
    shadow_color = $shadow
    position = 0, 36
    halign = center
    valign = bottom
}
