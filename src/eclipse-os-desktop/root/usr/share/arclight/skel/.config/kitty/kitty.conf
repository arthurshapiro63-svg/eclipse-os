# Midnight Blue — kitty
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5

background_opacity 0.78
window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 1
scrollback_lines 10000

# Colours
foreground            #c8d6f0
background            #0a0f1e
selection_foreground  #0a0f1e
selection_background  #2f7cff
cursor                #2f7cff
cursor_text_color     #0a0f1e
url_color             #5aa2ff

active_tab_foreground   #0a0f1e
active_tab_background   #2f7cff
inactive_tab_foreground #7d8bb0
inactive_tab_background #111a33
tab_bar_style           powerline

# black
color0  #111a33
color8  #3a4870
# red
color1  #ff5c7a
color9  #ff7d95
# green (teal, to stay in the blue family)
color2  #3ddbd9
color10 #6ee7e5
# yellow (pale blue)
color3  #8fb8ff
color11 #b3cfff
# blue
color4  #2f7cff
color12 #5aa2ff
# magenta (indigo)
color5  #6a7dff
color13 #8f9dff
# cyan
color6  #33c1ff
color14 #7ad6ff
# white
color7  #c8d6f0
color15 #eaf1ff
