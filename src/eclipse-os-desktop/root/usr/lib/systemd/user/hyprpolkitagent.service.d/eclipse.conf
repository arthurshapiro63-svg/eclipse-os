# Eclipse OS: the password prompt for sudo-like requests (polkit) is polkit-gnome, not hyprpolkitagent.
# Since 0.1.2 every system change asks for the administrator password, so the prompt must always work;
# hyprpolkitagent 0.2 crashed (SIGSEGV in Mesa) whenever it drew its dialog without GPU acceleration, which
# left no way to approve anything. polkit-gnome draws with GTK3/cairo and uses the Eclipse GTK theme.
# Every Hyprland config that starts `hyprpolkitagent.service` gets this agent.
[Service]
ExecStart=
ExecStart=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
